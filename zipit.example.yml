# Zipit example configuration
# Paths are resolved relative to this file unless absolute.

input: build/libs/app.jar
output: build/libs/app-obfuscated.jar

# Optional library jars or directories used for hierarchy / frame resolution.
libraries: []

# Keep rules may be Ant-style globs, member selectors, or @annotations.
keep:
  - com.example.Main
  - com.example.api.**
  # - com.example.model.User#id
  # - "@io.zipit.annotations.Keep"

softKeep: []

seed: 23303
preserveTimestamps: true
dryRun: false

# Optional policy preset: library | spring-boot | jackson | service-loader | micronaut | aggressive
preset: ""

# Keep public/protected classes completely (no transforms).
keepPublicApi: false

# Keep public/protected names only; string/constant/flow transforms still run.
softKeepPublicApi: false

renamer:
  enabled: true
  prefix: ""
  # repackage true + repackagePackage "*" gives every original package a
  # random short package name, hiding package-level semantics.
  repackage: false
  repackagePackage: ""
  # Kept classes (for example a scripting or injection API) that should still
  # receive a package-only move. Members and bytecode stay intact.
  repackageKept: []
  renameClasses: true
  renameMethods: true
  renameFields: true
  mappingFile: zipit-mapping.txt
  dictionary: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  minimumNameLength: 1

stringEncryption:
  enabled: true
  minLength: 2

integerEncryption:
  enabled: true
  includeLong: true

flowObfuscation:
  enabled: true
  level: light
  maxInstructions: 8000
  # Convert eligible methods into a state-machine dispatcher.
  flattening: false
  # Original class globs that must not be flattened (other transforms still run).
  flatteningExclude: []

debugInfo:
  enabled: true
  removeSourceFile: true
  removeLineNumbers: true
  removeLocalVariables: true
  removeSignatures: true
  removeInnerClasses: false
  removeKotlin: true

memberShuffle:
  enabled: true

invokeWrapper:
  enabled: false
  maxPerClass: 200

watermark:
  enabled: true
  id: acme-build

mapping:
  enabled: true
  file: zipit-mapping.txt
  # Optional previous mapping for stable names across builds.
  inputFile: ""

report:
  enabled: false
  htmlFile: build/reports/zipit-audit.html
  jsonFile: build/reports/zipit-audit.json

junkMembers:
  enabled: true
  methods: 2
  fields: 2

reflection:
  enabled: true
  # Rewrite Class.forName/loadClass string constants to renamed classes instead
  # of keeping those classes. Required to rename entry points loaded by name.
  rewriteClassStrings: false

trim:
  enabled: false
  removeUnusedPrivateMethods: true
  removeUnusedPrivateFields: true

parameterObfuscation:
  enabled: false

license:
  enabled: false
  file: ""
  publicKey: ""
  server: ""
  require: false
  features: []

resources:
  rewriteContent: false
  # Rename assets/<domain> directories and rewrite asset path strings in code.
  obfuscatePaths: false
  # Bare domain strings to rewrite as well (for ResourceLocation lookups).
  rewriteDomains: []

referenceObfuscation:
  enabled: false
  staticCalls: true
  virtualCalls: false
  fields: false
  constructors: false

exceptionObfuscation:
  enabled: false

incremental:
  enabled: false
  previousOutput: ""
  metadataFile: zipit-incremental.tsv

# Method virtualization: turn eligible method bodies into a custom bytecode
# interpreted at runtime. Methods with constructors (NEW), try/catch or
# invokedynamic are skipped automatically.
methodVirtualization:
  enabled: false
  maxInstructions: 2000
  # Maximum virtualized methods per class; 0 = unlimited.
  maxMethods: 0

# Anti-LLM countermeasures aimed at automated static analysis.
# - decoyMethodsPerClass: semantic decoy methods (Double Fond / SemAder style)
# - decoyCallSitesPerClass: guarded calls into decoys (opaque predicate)
# - wrapperLayers: nested forwarding methods around real bodies (Matryoshka style)
# - shieldVirtualization: encrypt/fragment VM payload arrays across holder classes
antiLlm:
  enabled: false
  decoyMethodsPerClass: 2
  decoyCallSitesPerClass: 2
  wrapperLayers: 1
  maxWrappedMethodsPerClass: 12
  shieldVirtualization: true

protection:
  antiDebug: false
