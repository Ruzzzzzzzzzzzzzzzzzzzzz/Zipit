name: build-and-protect

on:
  push:
  pull_request:

jobs:
  zipit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build and test Zipit
        run: bash build.sh build dist

      - name: Obfuscate application
        run: |
          java -jar dist/zipit-1.0.0-all.jar \
            -i build/libs/app.jar \
            -o build/libs/app-obfuscated.jar \
            --preset spring-boot \
            --verify \
            --report build/reports/zipit-audit.html \
            --report-json build/reports/zipit-audit.json

      - name: Upload protected artifact and audit
        uses: actions/upload-artifact@v4
        with:
          name: zipit-output
          path: |
            build/libs/app-obfuscated.jar
            build/libs/zipit-mapping.txt
            build/reports/zipit-audit.html
            build/reports/zipit-audit.json
